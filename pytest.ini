[pytest]
testpaths = tests
asyncio_mode = auto
# One event loop for all tests: the OpenAI client caches connections bound to the loop that opened them.
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
markers =
    live: calls the real OpenAI API / real internet (run with: pytest -m live)
addopts = -m "not live"
